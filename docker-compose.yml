services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.4@sha256:96581a398b0f6ad3acbd6dac9159540b0b065de0e7c03847c3b631ae162551ee
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
      TELEGRAM_VERBOSITY: ${TELEGRAM_API_VERBOSITY:-1}
    volumes:
      - ./tg_api_data:/var/lib/telegram-bot-api
      - ./data/tmp_uploads:/var/tmp/yunbot-uploads
    # 默认仅走容器内网通信；如需宿主机本地调试可取消下方注释：
    # ports:
    #   - "127.0.0.1:${TELEGRAM_API_HOST_PORT:-38081}:8081"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
    image: yuntransfer-bot:local
    restart: unless-stopped
    init: true
    depends_on:
      - telegram-bot-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MALLOC_ARENA_MAX: "2"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:?TELEGRAM_ADMIN_ID is required}
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      WEB_INTERNAL_PORT: "8082"
      WEB_BASE_URL: ${WEB_BASE_URL:-http://127.0.0.1:38082}
      WEB_TRUSTED_PROXIES: ${WEB_TRUSTED_PROXIES:-}
      WHITELIST_ENABLED: ${WHITELIST_ENABLED:-true}
      INITIAL_WHITELIST_IDS: ${INITIAL_WHITELIST_IDS:-}
      INITIAL_BLACKLIST_IDS: ${INITIAL_BLACKLIST_IDS:-}
      INITIAL_GROUP_WHITELIST_IDS: ${INITIAL_GROUP_WHITELIST_IDS:-}
      OPENLIST_BASE_URL: ${OPENLIST_BASE_URL:-}
      OPENLIST_PUBLIC_URL: ${OPENLIST_PUBLIC_URL:-}
      OPENLIST_TOKEN: ${OPENLIST_TOKEN:-}
      OPENLIST_USERNAME: ${OPENLIST_USERNAME:-}
      OPENLIST_PASSWORD: ${OPENLIST_PASSWORD:-}
      OPENLIST_BAIDU_PATH: ${OPENLIST_BAIDU_PATH:-/baidu/转存文件}
      OPENLIST_PIKPAK_PATH: ${OPENLIST_PIKPAK_PATH:-/pikpak/转存文件}
      OPENLIST_QUARK_PATH: ${OPENLIST_QUARK_PATH:-/quark/转存文件}
      OPENLIST_SHARE_TTL_HOURS: ${OPENLIST_SHARE_TTL_HOURS:-24}
      BAIDU_CLIENT_ID: ${BAIDU_CLIENT_ID:-}
      BAIDU_CLIENT_SECRET: ${BAIDU_CLIENT_SECRET:-}
      BAIDU_SAVE_PATH: ${BAIDU_SAVE_PATH:-/转存文件}
      PIKPAK_SAVE_PATH: ${PIKPAK_SAVE_PATH:-/My Pack/转存文件}
      PIKPAK_PAT: ${PIKPAK_PAT:-}
      PIKPAK_DIRECT_EXCLUSIVE_DIR: ${PIKPAK_DIRECT_EXCLUSIVE_DIR:-false}
      QUARK_SAVE_PATH: ${QUARK_SAVE_PATH:-/转存文件}
      QUARK_COOKIE: ${QUARK_COOKIE:-}
      MAX_DELIVERY_FILES: ${MAX_DELIVERY_FILES:-10}
      MAX_TEMP_DISK_MB: ${MAX_TEMP_DISK_MB:-2560}
      PENDING_INPUT_TTL_SECONDS: ${PENDING_INPUT_TTL_SECONDS:-600}
      MAX_RETAINED_TASKS: ${MAX_RETAINED_TASKS:-1000}
      DATA_DIR: /app/data
      SHARED_UPLOAD_DIR: /var/tmp/yunbot-uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./data/tmp_uploads:/var/tmp/yunbot-uploads
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_HOST_PORT:-38082}:8082"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
