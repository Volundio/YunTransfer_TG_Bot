name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增级别 (patch / minor / major)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-and-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build Image & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python syntax and Compose config
        run: |
          set -euo pipefail
          python3 -m compileall -q src
          docker compose --env-file .env.example config -q

      - name: Compute version and image metadata
        id: meta
        env:
          DOCKERHUB_USER_RAW: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN_PRESENT: ${{ secrets.DOCKERHUB_TOKEN != '' && 'yes' || 'no' }}
          DOCKERHUB_REPO_OVERRIDE: ${{ vars.DOCKERHUB_REPO || '' }}
          INPUT_BUMP: ${{ inputs.bump || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USER_RAW}" ] || [ "${DOCKERHUB_TOKEN_PRESENT}" != "yes" ]; then
            echo "::error::未检测到 DOCKERHUB_USERNAME 或 DOCKERHUB_TOKEN，请检查仓库 Secrets 配置。"
            exit 1
          fi

          DOCKERHUB_USER="$(printf '%s' "${DOCKERHUB_USER_RAW}" | tr '[:upper:]' '[:lower:]')"
          RAW_REPO="${DOCKERHUB_REPO_OVERRIDE:-${GITHUB_REPOSITORY#*/}}"
          DOCKERHUB_REPO="$(printf '%s' "${RAW_REPO}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${DOCKERHUB_USER}/${DOCKERHUB_REPO}"

          # 拉取最新远端标签，确保串行排队任务能感知上一轮刚发布的版本
          git fetch --tags --force --quiet

          ALL_SEMVER_TAGS="$(git tag -l | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V)"
          HEAD_TAG="$(git tag --points-at HEAD | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"

          PREV_TAG=""
          if [ -n "${HEAD_TAG}" ] && [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            TAG="${HEAD_TAG}"
            VERSION="${HEAD_TAG#v}"
            PREV_TAG="$(printf '%s\n' "${ALL_SEMVER_TAGS}" | awk -v skip="${HEAD_TAG}" 'NF && $0 != skip { last = $0 } END { print last }')"
          elif [ -z "${ALL_SEMVER_TAGS}" ]; then
            # 首次发布从 1.0.0 开始
            VERSION="1.0.0"
            TAG="v1.0.0"
          else
            LATEST_TAG="$(printf '%s\n' "${ALL_SEMVER_TAGS}" | tail -n 1)"
            PREV_TAG="${LATEST_TAG}"
            BASE_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VER}"

            BUMP="${INPUT_BUMP}"
            if [ -z "${BUMP}" ]; then
              COMMIT_MSG="$(git log -1 --pretty=%B)"
              if printf '%s' "${COMMIT_MSG}" | grep -Eq '(\[major\]|BREAKING CHANGE)'; then
                BUMP="major"
              elif printf '%s' "${COMMIT_MSG}" | grep -Eq '\[minor\]'; then
                BUMP="minor"
              else
                BUMP="patch"
              fi
            fi

            case "${BUMP}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prev_tag=${PREV_TAG}"
            echo "image_name=${IMAGE_NAME}"
            echo "asset_prefix=${DOCKERHUB_REPO}-${TAG}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved release version: ${TAG} (previous: ${PREV_TAG:-none})"
          echo "Target Docker Hub image: ${IMAGE_NAME}:${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image to Docker Hub
        id: push_hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export linux/amd64 image archive for Release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/${{ steps.meta.outputs.asset_prefix }}-linux-amd64.tar
          cache-from: type=gha

      - name: Export linux/arm64 image archive for Release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/${{ steps.meta.outputs.asset_prefix }}-linux-arm64.tar
          cache-from: type=gha

      - name: Package assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.push_hub.outputs.digest }}
          ASSET_PREFIX: ${{ steps.meta.outputs.asset_prefix }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p release_assets
          gzip -c "/tmp/${ASSET_PREFIX}-linux-amd64.tar" > "release_assets/${ASSET_PREFIX}-linux-amd64.tar.gz"
          gzip -c "/tmp/${ASSET_PREFIX}-linux-arm64.tar" > "release_assets/${ASSET_PREFIX}-linux-arm64.tar.gz"
          rm -f "/tmp/${ASSET_PREFIX}-linux-amd64.tar" "/tmp/${ASSET_PREFIX}-linux-arm64.tar"

          cp docker-compose.yml release_assets/docker-compose.yml
          cp .env.example release_assets/.env.example

          (
            cd release_assets
            sha256sum \
              "${ASSET_PREFIX}-linux-amd64.tar.gz" \
              "${ASSET_PREFIX}-linux-arm64.tar.gz" \
              docker-compose.yml \
              .env.example > SHA256SUMS.txt
          )

          if [ -n "${PREV_TAG}" ]; then
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${TARGET_SHA}" || true)"
          else
            CHANGELOG="$(git log --no-merges -n 20 --pretty=format:'- %s (%h)' "${TARGET_SHA}" || true)"
          fi
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- Automated build for commit ${TARGET_SHA:0:7}"
          fi

          cat > release_notes.md <<EOF
          ## Docker Hub 镜像拉取

          支持 \`linux/amd64\` 与 \`linux/arm64\` 多架构镜像：

          \`\`\`bash
          docker pull ${IMAGE_NAME}:${VERSION}
          # 或拉取最新稳定版
          docker pull ${IMAGE_NAME}:latest
          \`\`\`

          - **Image Digest**: \`${IMAGE_DIGEST}\`

          ## 离线镜像包导入（GitHub Releases 附件）

          如服务器拉取 Docker Hub 受限，可直接下载本页附件中的对应架构镜像包导入：

          \`\`\`bash
          # x86_64 (amd64) 服务器：
          docker load -i ${ASSET_PREFIX}-linux-amd64.tar.gz

          # ARM64 服务器：
          docker load -i ${ASSET_PREFIX}-linux-arm64.tar.gz
          \`\`\`

          ## 变更记录

          ${CHANGELOG}
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_assets/* --clobber
            gh release edit "${TAG}" --title "YunTransfer Telegram Bot ${TAG}" --notes-file release_notes.md
          else
            gh release create "${TAG}" release_assets/* \
              --target "${TARGET_SHA}" \
              --title "YunTransfer Telegram Bot ${TAG}" \
              --notes-file release_notes.md \
              --latest
          fi
